# 一键拉取镜像并启动：
#   1. 在项目目录准备外部 env（默认 .env，或通过 ENV_FILE）
#   2. 默认镜像 mywltd/qimeng-next:latest；可设置 DOCKER_IMAGE
#   3. MySQL 在宿主机 3306：在 .env 里将 KUN_DATABASE_URL 主机写为 host.docker.internal
#      示例：mysql://用户:密码@host.docker.internal:3306/库名
#   4. Redis 仅 compose 内部使用：未映射宿主机端口，不占 6379，与宿主机 Redis 互不影响
#   5. docker compose pull && docker compose up -d
#
# 可选：HOST_PORT、HOST_BIND、UPLOADS_DIR（见上）
#       PM2_INSTANCES：max=按 CPU 核数起多进程（默认）；或填数字限制进程数（省内存/MySQL 连接）
#       UV_THREADPOOL_SIZE：Node libuv 线程池，默认 16（I/O 多时可略调大）

services:
  redis:
    # 勿添加 ports；仅同网络内服务可通过主机名 redis:6379 访问
    image: redis:7.4.2
    container_name: qimeng-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  qimeng-next:
    image: ${DOCKER_IMAGE:-qmgame/qimeng-next:latest}
    container_name: qimeng-next
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # 绑定环回地址，避免 Docker 在 0.0.0.0 监听从而绕过防火墙对公网网卡的限制
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3001}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PM2_INSTANCES: ${PM2_INSTANCES:-max}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
    extra_hosts:
      # Linux 下解析到宿主机，便于 KUN_DATABASE_URL 使用 host.docker.internal:3306
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/uploads

volumes:
  redis_data:
